<!doctype html><html><body style="background:#556;margin:0">
<div id="out"></div>
<script type="module">
import { buildCharacters } from '/src/art/characters.ts';
const canvases = {};
const fake = { textures: { exists: (k) => !!canvases[k], addCanvas: (k, c) => { canvases[k] = c; return { add(){}, get(){ return { setSize(){} }; } }; } } };
buildCharacters(fake);
const params = new URLSearchParams(location.search);
const mod = params.get('mod');
if (mod) { const m = await import(mod); m[params.get('fn')](fake); }
const out = document.getElementById('out');
const only = params.get('only') ? new RegExp(params.get('only')) : null; const sc = +(params.get('s')||3);
out.style.display='flex'; out.style.flexWrap='wrap'; out.style.gap='6px';
for (const [k, c] of Object.entries(canvases)) { if (only && !only.test(k)) continue;
  const d = document.createElement('div'); d.style.color='#fff'; d.textContent = k; const box=document.createElement('div'); box.appendChild(d); out.appendChild(box);
  c.style.width = c.width * sc + 'px'; c.style.imageRendering = 'pixelated'; c.style.background = '#8a8fa8';
  box.appendChild(c);
}
window.done = true;
</script></body></html>
